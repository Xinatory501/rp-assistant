name: rp_assistant
description: RP Assistant — AmazingRP overlay tool for Windows
version: 1.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0
  window_manager: ^0.4.3
  http: ^1.2.2
  flutter_markdown: ^0.7.4
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  crypto: ^3.0.3
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
